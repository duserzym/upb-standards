# Curated apatite reference-material record.
# Only documented inputs are stored; redundant ratios are derived in Python.
format_version = 2
material = "apatite"

[standards."MADUCSB"]
aliases = ["MAD-UCSB"]

[[standards."MADUCSB".measurements]]
role = "concentration"
unit = "ug/g"
status = "recommended"
source = "deer2013"
notes = "Elemental mass fraction assigned to the {quantity} measurement channel; value is not multiplied by the isotope abundance. Average apatite composition."

[standards."MADUCSB".measurements.values]
"31P" = 182326.02705940383
"44Ca" = 400442.6533523538

[[standards."MADUCSB".measurements]]
role = "initial_ratio"
unit = "ratio"
status = "provisional"
source = "apen2022"
notes = "Initial common-Pb ratio from the total Pb-U ID-TIMS isochron."

[standards."MADUCSB".measurements.values]
"207Pb/206Pb_i" = { value = 0.71, uncertainty = 0.10, uncertainty_type = "2sd" }

[[standards."MADUCSB".measurements]]
role = "reference_age"
unit = "Ma"
status = "provisional"
source = "apen2022"
notes = "Total Pb-U ID-TIMS isochron age; concordant radiogenic ratios are derived."

[standards."MADUCSB".measurements.values]
"concordia_age" = { value = 467.4, uncertainty = 8.4, uncertainty_type = "2sd" }
