# Curated apatite reference-material record.
# Only documented inputs are stored; redundant ratios are derived in Python.
format_version = 2
material = "apatite"

[standards."AFB1"]
aliases = []

[[standards."AFB1".measurements]]
role = "concentration"
unit = "ug/g"
status = "provisional"
source = "deer2013"
notes = "Elemental mass fraction assigned to the {quantity} measurement channel; value is not multiplied by the isotope abundance. Average apatite composition. Legacy oxide-to-element mass-fraction conversion (oxide wt.% * 10000 * elemental/oxide molar-mass ratio), not a measurement of this standard. The original oxide averages and atomic weights are not preserved; the stored numbers could not be reproduced from the book tables and remain unverified (audit-2026-11)."

[standards."AFB1".measurements.values]
"31P" = 182326.02705940383
"44Ca" = 400442.6533523538

[[standards."AFB1".measurements]]
role = "initial_ratio"
unit = "ratio"
status = "recommended"
source = "kennedy2023"
locator = "Table 4, p. 390"
notes = "Common-Pb 206Pb/204Pb and 207Pb/204Pb from the concordia-constrained 3D ID-TIMS regression (Pbc 3D columns), not the measured total Pb composition or the Stacey-Kramers columns."

[standards."AFB1".measurements.values]
"206Pb/204Pb_i" = 19.72
"207Pb/204Pb_i" = 15.80

[[standards."AFB1".measurements]]
role = "reference_age"
unit = "Ma"
status = "recommended"
source = "kennedy2023"
locator = "Table 4, p. 390; ID-TIMS methods, p. 378"
notes = "Weighted mean 3D concordia intercept age. Methods specify 95% confidence and exclude tracer-calibration and decay-constant systematic uncertainties. No initial 230Th disequilibrium correction."

[standards."AFB1".measurements.values]
"concordia_age" = { value = 473.25, uncertainty = 0.09, uncertainty_type = "expanded_95" }
