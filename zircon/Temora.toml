# Curated zircon reference-material record.
# Only documented inputs are stored; redundant ratios are derived in Python.
format_version = 2
material = "zircon"

[standards."Temora"]
aliases = ["Temora-2"]

[[standards."Temora".measurements]]
role = "concentration"
unit = "ug/g"
status = "provisional"
source = "deer2013"
notes = "Elemental mass fraction assigned to the {quantity} measurement channel; value is not multiplied by the isotope abundance. Average zircon composition."

[standards."Temora".measurements.values]
"29Si" = 151443.22960004435
"91Zr" = 487760.24454904505

[[standards."Temora".measurements]]
role = "initial_ratio"
unit = "ratio"
status = "provisional"
source = "stacey1975"
notes = "Canonical initial/common-Pb ratio; reciprocal and cross-ratios are derived."

[standards."Temora".measurements.values]
"206Pb/204Pb_i" = 18.076074416
"207Pb/204Pb_i" = 15.574115719319678
"208Pb/204Pb_i" = 37.8590983248

[[standards."Temora".measurements]]
role = "radiogenic_ratio"
unit = "ratio"
status = "provisional"
source = "black2004"
notes = "Documented radiogenic ratio; reciprocal and linked ratios are derived."

[standards."Temora".measurements.values]
"206Pb/238U*" = 0.066853
"207Pb/235U*" = 0.50801

[[standards."Temora".measurements]]
role = "reference_age"
unit = "Ma"
status = "provisional"
source = "black2004"
notes = "Accepted age; concordant radiogenic ratios are derived when direct values are absent."

[standards."Temora".measurements.values]
"concordia_age" = 417.2
