"208Pb/232Th*" = 0.02096162355444653

[[standards."R33".measurements]]
role = "reference_age"
unit = "Ma"
status = "recommended"
source = "black2004"
locator = "Table 5, p. 131; Table 2 and Section 3"
notes = "R33: recommended ID-TIMS weighted mean 206Pb/238U age, 2-sigma."

