# Curated zircon reference-material record.
# Only documented inputs are stored; redundant ratios are derived in Python.
format_version = 2
material = "zircon"

[standards."OG1"]
aliases = []

[[standards."OG1".measurements]]
role = "concentration"
unit = "ug/g"
status = "provisional"
source = "deer2013"
notes = "Elemental mass fraction assigned to the {quantity} measurement channel; value is not multiplied by the isotope abundance. Average zircon composition. Legacy oxide-to-element mass-fraction conversion (oxide wt.% * 10000 * elemental/oxide molar-mass ratio), not a measurement of this standard. The original oxide averages and atomic weights are not preserved; the stored numbers could not be reproduced from the book tables and remain unverified (audit-2026-11)."

[standards."OG1".measurements.values]
"29Si" = 151443.22960004435
"91Zr" = 487760.24454904505

[[standards."OG1".measurements]]
role = "initial_ratio"
unit = "ratio"
status = "provisional"
source = "stacey1975"
notes = "Stacey-Kramers second-stage model Pb at the OG1 age, 3465.4 Ma (Archean): R_j(t) = R_j(3700 Ma) + parent/204Pb * [exp(lambda_j * 3700 Ma) - exp(lambda_j * t)] with Table 8 anchors (11.152, 12.998, 31.23), parent ratios (9.74, 9.74/137.88, 36.84), lambda238 = 1.55125e-10, lambda235 = 9.8485e-10 and lambda232 = 4.9475e-11 per year. The values before 2026-11-16 (16.887, 15.464, 36.539) were model Pb at about 1.1 Ga, not the OG1 age. Stern et al. (2009) report negligible common Pb in OG1. Reciprocal and cross-ratios are derived."

[standards."OG1".measurements.values]
"206Pb/204Pb_i" = 11.769958
"207Pb/204Pb_i" = 13.555308
"208Pb/204Pb_i" = 31.740524

[[standards."OG1".measurements]]
role = "radiogenic_ratio"
unit = "ratio"
status = "provisional"
source = "stern2009"
notes = "Documented radiogenic ratio; reciprocal and linked ratios are derived."

[standards."OG1".measurements.values]
"206Pb/238U*" = 0.7113
"207Pb/235U*" = 29.3322
"207Pb/206Pb*" = { value = 0.29907, uncertainty = 0.00011, uncertainty_type = "expanded_95", status = "recommended", locator = "Abstract, p. 145", notes = "TIMS 207Pb*/206Pb* reference value, 95 % confidence limit." }

[[standards."OG1".measurements]]
role = "reference_age"
unit = "Ma"
status = "recommended"
source = "stern2009"
locator = "Abstract, p. 145"
notes = "OG1 ID-TIMS 207Pb*/206Pb* reference age (Archean), 95 % confidence limit, from the reference 207Pb*/206Pb* = 0.29907 +/- 0.00011."

[standards."OG1".measurements.values]
"207Pb/206Pb_age" = { value = 3465.4, uncertainty = 0.6, uncertainty_type = "expanded_95" }

[[standards."OG1".measurements]]
role = "reference_age"
unit = "Ma"
status = "provisional"
source = "stern2009"
locator = "Abstract, p. 145"
notes = "Concordance assumption, not a published concordia age. The published 207Pb/206Pb age is repeated here as concordia_age so UPbRPy can derive the radiogenic ratios that are not stored. Before the 2026-11 audit this record stored 3465.5 Ma under concordia_age."

[standards."OG1".measurements.values]
"concordia_age" = 3465.4
