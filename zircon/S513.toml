notes = "Concordance assumption, not a published concordia age. The recommended 206Pb/238U age is repeated here as concordia_age so UPbRPy can derive 208Pb/232Th*; the published LA-ICP-MS 208Pb/232Th age (561.3 +/- 3.3 Ma) agrees. Replaces the UPbR26plus archive value 208Pb/232Th* = 0.028153518284538936 (a concordant ratio at 561.2 Ma)."

