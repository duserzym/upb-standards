[[standards."S513".measurements]]
role = "initial_ratio"
unit = "ratio"
status = "provisional"
source = "stacey1975"
notes = "Stacey-Kramers model Pb at about 561 Ma. For S513, Seiland and AUSZ2, the archive rows labelled 206Pb/207Pb and 206Pb/208Pb contain 207Pb/204Pb and 208Pb/204Pb, respectively; stored here under their canonical keys, as in Seiland.toml. These are legacy model assignments, not measured common-Pb ratios. Intended second-stage growth law: R_j(t) = R_j(3700 Ma) + parent/204Pb * [exp(lambda_j * 3700) - exp(lambda_j * t)], with Table 8 anchors (11.152, 12.998, 31.23) and parent ratios (9.74, 9.74/137.88, 36.84) for 206Pb, 207Pb, 208Pb. The exact legacy decay constants and input age are unknown. Checked against the two-stage model parameters in Table 8 and growth curve in Table 9; calculation age and constants are not fully documented, and the stored triplet is not verified as that model. Retained pending recovery of the original calculation (audit-2026-11)."

[standards."S513".measurements.values]
"206Pb/204Pb_i" = 17.81427985313352
"207Pb/204Pb_i" = 15.576740129737942
"208Pb/204Pb_i" = 37.59322277150352

