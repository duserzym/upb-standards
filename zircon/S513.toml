# Curated zircon reference-material record.
# Published values from Luo et al. (2025); redundant ratios are derived in Python.
format_version = 2
material = "zircon"

[standards."S513"]
aliases = []
description = "Gem-quality Sri Lankan zircon, 51.3 carats (Luo et al. 2025)."

[[standards."S513".measurements]]
role = "concentration"
unit = "ug/g"
status = "provisional"
source = "deer2013"
notes = "Elemental mass fraction assigned to the {quantity} measurement channel; value is not multiplied by the isotope abundance. Average zircon composition, used for internal standardisation; Luo et al. (2025) do not report Si or Zr. Legacy oxide-to-element mass-fraction conversion (oxide wt.% * 10000 * elemental/oxide molar-mass ratio), not a measurement of this standard. The original oxide averages and atomic weights are not preserved; the stored numbers could not be reproduced from the book tables and remain unverified (audit-2026-11)."

[standards."S513".measurements.values]
"29Si" = 151443.22960004435
"91Zr" = 487760.24454904505

[[standards."S513".measurements]]
role = "concentration"
unit = "ug/g"
status = "provisional"
source = "luo2025"
locator = "Abstract, p. 403"
notes = "Elemental mass fractions (2s) assigned to the {quantity} measurement channel; values are not multiplied by the isotope abundance. Total Pb (119 ug/g) is assigned to the 208Pb channel. The authors report these elements homogeneous to 8 % (1s) or better."

[standards."S513".measurements.values]
"177Hf" = { value = 8259, uncertainty = 244, uncertainty_type = "2sd" }
"208Pb" = { value = 119, uncertainty = 5.20, uncertainty_type = "2sd" }
"232Th" = { value = 89.6, uncertainty = 3.92, uncertainty_type = "2sd" }
"238U" = { value = 924, uncertainty = 64.6, uncertainty_type = "2sd" }

[[standards."S513".measurements]]
role = "initial_ratio"
unit = "ratio"
status = "provisional"
source = "stacey1975"
notes = "Stacey-Kramers model Pb at about 561 Ma; Luo et al. (2025) do not report a common-Pb composition. The stored triplet agrees with the second-stage model at 561.18 Ma (17.8174, 15.5767, 37.5934 with lambda238 = 1.55125e-10, lambda235 = 9.8485e-10, lambda232 = 4.9475e-11 per year and 238U/235U = 137.88) to within 0.02 %; the exact legacy constants are not documented. Reciprocal and cross-ratios are derived."

[standards."S513".measurements.values]
"206Pb/204Pb_i" = 17.81427985313352
"207Pb/204Pb_i" = 15.576740129737942
"208Pb/204Pb_i" = 37.59322277150352

[[standards."S513".measurements]]
role = "radiogenic_ratio"
unit = "ratio"
status = "recommended"
source = "luo2025"
locator = "Abstract, p. 403"
notes = "Th-corrected CA-ID-TIMS weighted mean ratios, n = 8, 2s (MSWD 0.22, 0.19 and 0.35). These are the ratios behind the recommended 561.18 Ma age. Reciprocal ratios are derived."

[standards."S513".measurements.values]
"206Pb/238U*" = { value = 0.090955, uncertainty = 0.000019, uncertainty_type = "2sd" }
"207Pb/235U*" = { value = 0.73873, uncertainty = 0.00023, uncertainty_type = "2sd" }
"207Pb/206Pb*" = { value = 0.058934, uncertainty = 0.000008, uncertainty_type = "2sd" }

[[standards."S513".measurements]]
role = "reference_age"
unit = "Ma"
status = "recommended"
source = "luo2025"
locator = "Abstract, p. 403"
notes = "Th-corrected weighted mean 206Pb/238U CA-ID-TIMS age, n = 8, 95 % confidence, MSWD = 0.9, recommended by the authors as the best age estimate of S513. In situ 206Pb/238U ages agree: LA-ICP-MS 560.8 +/- 5.8/10.2 Ma (2s, n = 260) and SIMS 562.4 +/- 7.2/13.4 Ma (2s, n = 198)."

[standards."S513".measurements.values]
